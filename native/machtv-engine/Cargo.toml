[package]
name = "machtv-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "machtv_engine"
crate-type = ["cdylib"]

[dependencies]
jni = "0.22.4"
rustls-platform-verifier = "0.7.0"
server = { git = "https://github.com/stremio-native/stream-server", rev = "368666eb09f9c4849a7df7f2a6a8b26171f24cfb", default-features = false, features = ["libtorrent"] }

[profile.release]
lto = true
opt-level = "s"

[patch."https://github.com/stremio-native/stream-server"]
enginefs = { path = "../stream-server/enginefs" }
libtorrent-sys = { path = "../stream-server/bindings/libtorrent-sys" }
