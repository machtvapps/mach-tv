import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "9.5.1" apply false
    id "com.android.library" version "9.5.1" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.2.10" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "2.2.10" apply false
}

def engineMetadata = new JsonSlurper().parseText(providers.exec {
    commandLine "cargo", "metadata", "--format-version", "1",
        "--manifest-path", new File(settingsDir, "native/machtv-engine/Cargo.toml").absolutePath
}.standardOutput.asText.get())

def cargoPackageDir = { String name ->
    new File(engineMetadata.packages.find { it.name == name }.manifest_path).parentFile
}

gradle.ext.streamServerDir = cargoPackageDir("server").parentFile

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven {
            url = new File(cargoPackageDir("rustls-platform-verifier-android"), "maven").toURI()
            metadataSources.artifact()
        }
    }
}

rootProject.name = "mach-tv"
include ":core"
include ":app"
include ":ffmpeg"
