name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check the tag against the version name
        run: |
          grep -qF "versionName \"${GITHUB_REF_NAME}\"" app/build.gradle || { echo "Tag ${GITHUB_REF_NAME} differs from versionName in app/build.gradle"; exit 1; }
      - name: Find the release notes for the version code
        run: |
          code=$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle)
          notes="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          test -s "$notes" || { echo "$notes is missing or empty"; exit 1; }
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
      - name: Install the Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;28.2.13676358"
      - name: Install the Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install Ninja and pkg-config
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout 84bab45d415d22042bd0b9081aea57f362da3f35
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "vcpkg.dir=$RUNNER_TEMP/vcpkg" >> local.properties
      - name: Decode signing key
        env:
          SIGNING_JKS_FILE_BASE64: ${{ secrets.SIGNING_JKS_FILE_BASE64 }}
        run: |
          test -n "${SIGNING_JKS_FILE_BASE64:-}" || { echo "SIGNING_JKS_FILE_BASE64 is empty or unset"; exit 1; }
          echo -n "$SIGNING_JKS_FILE_BASE64" | base64 -d > app/upload-keystore.jks
      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk mach-tv-universal-release.apk
      - uses: softprops/action-gh-release@v3
        with:
          files: mach-tv-universal-release.apk
          body_path: ${{ env.RELEASE_NOTES }}
          fail_on_unmatched_files: true
      - name: Add the release to the F-Droid repository
        env:
          GH_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: gh workflow run publish.yml --repo machtvapps/machtvapps.github.io --ref main
